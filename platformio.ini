[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
; 使用 min_spiffs 分区方案（OTA 部分改为 APP 空间，给 BLE 栈腾地方）
board_build.partitions = min_spiffs.csv
; 让 lib/ 下的库能找到 include/ 中的 global_config.h
build_flags = -I include
  ; 禁用欠压检测器，防止 USB 供电不足时 BLE/Wi-Fi 初始化导致重启循环
  ; TODO: 后续换好线或外部供电后去掉这两行
  -D CONFIG_BROWNOUT_DET=0
  -D CONFIG_BROWNOUT_DET_LVL_SEL_0=0
  ; 优化体积
  -Os
; 蓝牙 HID 库
lib_deps = t-vk/ESP32 BLE Keyboard@^0.3.2